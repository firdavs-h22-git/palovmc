<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PalovMC Donat va Do'kon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Konsepsiya: butun sahifa bitta Minecraft dunyosi. Orqada piksel osmon scroll bilan kunduzdan tunga o'tadi.
   Donat darajalari qorong'u taxtalar, do'kon esa och kulrang inventar oynasi. Palov qozoni logotip ramzi. */
:root{
  --ink:#0d1018; --panel:#1b1f27; --panel2:#262b35;
  --stone:#c6c6c6; --stone-d:#8b8b8b; --stone-dd:#373737;
  --grass:#6be04a; --grass-d:#3e7d24; --dirt:#85592f; --dirt-d:#4d3019;
  --gold:#ffd23f; --dia:#4de8dc; --red:#ff5555; --purple:#b66bff; --white:#f4f4f4; --text:#e9ecef; --mute:#9aa3ad;
  --px:'Press Start 2P',ui-monospace,monospace; --vt:'VT323',ui-monospace,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--ink);color:var(--text);font:400 22px/1.25 var(--vt);overflow-x:hidden;image-rendering:pixelated}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.sp{image-rendering:pixelated;display:block}
.wrap{padding-left:var(--gx);padding-right:var(--gr);max-width:1180px;margin:0 auto;position:relative}
h2{font:400 clamp(1rem,3.6vw,1.7rem)/1.4 var(--px);margin:0;color:var(--white);text-shadow:3px 3px 0 #000;text-wrap:balance}
.lab{font:400 11px/1.4 var(--px);color:var(--gold);letter-spacing:.06em;text-transform:uppercase;text-shadow:2px 2px 0 #000}

/* Minecraft tugma */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:10px 20px;background:#8b8b8b;color:#fff;font:400 12px/1.3 var(--px);text-shadow:2px 2px 0 #3f3f3f;border:0;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #c9c9c9,0 0 0 3px #000;text-transform:uppercase;transition:transform .08s}
.btn:hover{background:#7a86c9;box-shadow:inset -4px -4px 0 #4a5496,inset 4px 4px 0 #b4bdf5,0 0 0 3px #fff}
.btn:active{transform:translateY(3px)}
.btn.g{background:#4e9a2e;box-shadow:inset -4px -4px 0 #2b5f16,inset 4px 4px 0 #8fdc66,0 0 0 3px #000}
.btn.g:hover{background:#63b83c;box-shadow:inset -4px -4px 0 #2b5f16,inset 4px 4px 0 #b6f593,0 0 0 3px #fff}
.btn.y{background:#d9a417;box-shadow:inset -4px -4px 0 #8a6200,inset 4px 4px 0 #ffe27a,0 0 0 3px #000;color:#2b1c00;text-shadow:none}
.btn.y:hover{background:#ffc928}
.btn[disabled]{opacity:.5;pointer-events:none}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;image-rendering:pixelated;background:#58aaff}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}

/* yuqori panel */
nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gr) 10px var(--gx);background:rgba(10,12,18,.82);border-bottom:4px solid #000;backdrop-filter:blur(4px)}
nav .brand{display:flex;align-items:center;gap:10px;font:400 14px var(--px);color:var(--gold);text-shadow:2px 2px 0 #000;margin-right:auto}
nav .links{display:flex;gap:6px}
nav .links a{font:400 11px var(--px);padding:10px 12px;color:#fff;text-shadow:2px 2px 0 #000}
nav .links a:hover{background:rgba(255,255,255,.12)}
.xpc{font:400 10px var(--px);color:var(--grass);text-shadow:2px 2px 0 #000;white-space:nowrap}
.mute{width:44px;height:44px;background:#222;border:0;box-shadow:inset -3px -3px 0 #000,inset 3px 3px 0 #555;font:400 11px var(--px);color:#fff}
@media (max-width:760px){nav .links{display:none}.xpc{display:none}}

/* hero */
.hero{position:relative;padding:calc(110px + env(safe-area-inset-top,0px)) 0 120px;text-align:center}
.logo{font:400 clamp(1.5rem,11.4vw,6.4rem)/1 var(--px);margin:0;display:flex;justify-content:center;letter-spacing:.02em;padding:.2em 0 .3em}
.logo span{display:inline-block;animation:drop 1s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*.09s);transition:transform .2s}
.logo span:hover{transform:translateY(-.25em) rotate(-4deg)}
.logo .a{color:#ffd23f;text-shadow:.04em .04em 0 #8a5a10,.08em .08em 0 #7a4f0e,.12em .12em 0 #6b440c,.16em .16em 0 #5c390a,.2em .2em 0 #4d2f08,.3em .3em .1em rgba(0,0,0,.45)}
.logo .b{color:#7cf05a;text-shadow:.04em .04em 0 #3a8a22,.08em .08em 0 #327a1d,.12em .12em 0 #2b6a18,.16em .16em 0 #245b14,.2em .2em 0 #1d4c10,.3em .3em .1em rgba(0,0,0,.45)}
@keyframes drop{from{transform:translateY(-110vh) rotate(25deg)}}
.plate{display:inline-block;max-width:640px;margin:18px auto 0;padding:14px 20px;background:rgba(8,10,16,.78);box-shadow:inset 0 0 0 3px #000,inset 0 0 0 6px rgba(255,255,255,.14);color:#fff;font-size:clamp(20px,3.4vw,26px)}
.ip{display:inline-flex;align-items:stretch;margin:30px auto 0;max-width:100%;flex-wrap:wrap;justify-content:center;gap:0;background:#0b0d12;box-shadow:0 0 0 4px #000,0 0 0 8px #555}
.ip div{padding:14px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.ip small{font:400 9px var(--px);color:var(--mute)}
.ip b{font:400 clamp(.9rem,3.2vw,1.35rem) var(--px);color:var(--dia);overflow-wrap:anywhere;text-align:left}
.cta{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.hint{margin-top:26px;font-size:20px;color:#fff;text-shadow:2px 2px 0 #000;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}

/* zamin chizig'i */
.ground{height:48px;background-repeat:repeat-x;background-size:64px 48px;image-rendering:pixelated;background-color:#4d3019;position:relative;z-index:1}

.sec{background:rgba(13,16,24,var(--secA,.9));padding:clamp(56px,9vh,96px) 0;position:relative}
.sec-h{display:flex;flex-direction:column;gap:14px;margin-bottom:38px}
.sec-h p{margin:0;max-width:60ch;color:#c7ced6}

/* chegirma lentasi */
.tapew{overflow:hidden;padding:14px 0;position:relative;z-index:3;margin:-10px 0}
.tape{background:var(--gold);color:#241800;overflow:hidden;white-space:nowrap;transform:rotate(-1.6deg) scale(1.03);box-shadow:0 6px 0 #000,0 -4px 0 #000}
.tape div{display:inline-flex;gap:30px;padding:12px 0;will-change:transform;font:400 14px var(--px)}
.tape i{font-style:normal;opacity:.5}

/* donat kartalari */
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));gap:26px;align-items:stretch}
.rank{--c:#55ff55;--g:85,255,85;position:relative;min-width:0;background:var(--panel);padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:inset -4px -4px 0 #0b0d12,inset 4px 4px 0 rgba(var(--g),.55),0 0 0 4px #000,0 0 28px rgba(var(--g),.22);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.rank .glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(var(--g),.34) 45%,rgba(255,255,255,.22) 50%,transparent 62%);background-size:320% 100%;animation:glint 3.2s linear infinite;animation-delay:var(--gd,0s);mix-blend-mode:screen}
@keyframes glint{from{background-position:130% 0}to{background-position:-130% 0}}
.rank .tagr{position:absolute;top:-16px;right:14px;background:#d63a2f;color:#fff;font:400 9px var(--px);padding:7px 9px;box-shadow:0 0 0 3px #000}
.rank h3{margin:0;font:400 20px var(--px);color:var(--c);text-shadow:3px 3px 0 #000;display:flex;align-items:center;gap:12px}
.chat{background:rgba(0,0,0,.55);padding:8px 10px;font-size:22px;overflow-wrap:anywhere;min-height:52px}
.chat b{color:var(--c);font-weight:400}
.perks{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1}
.perks li{display:flex;gap:10px;align-items:flex-start;color:#dfe5ea}
.perks li::before{content:"";flex:0 0 14px;height:14px;margin-top:5px;background:var(--grass);box-shadow:inset -3px -3px 0 var(--grass-d),inset 3px 3px 0 #b6f593}
.price{font:400 16px var(--px);color:var(--gold);text-shadow:2px 2px 0 #000}
.price small{font:400 20px var(--vt);color:var(--mute);text-shadow:none}

/* do'kon: inventar oynasi */
.inv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:start}
.gui{background:var(--stone);color:#3f3f3f;padding:18px;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,0 0 0 4px #000;min-width:0}
.gui h4{margin:0 0 12px;font:400 12px var(--px);color:#3f3f3f}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1;background:#8b8b8b;border:0;padding:0;box-shadow:inset 4px 4px 0 #373737,inset -4px -4px 0 #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.slot:hover,.slot.sel{background:#a5a5ff}
.slot.sel{box-shadow:inset 4px 4px 0 #373737,inset -4px -4px 0 #fff,0 0 0 4px #ffd23f}
.slot img{width:52%;max-width:84px;transition:transform .15s}
.slot:hover img{transform:translateY(-6px) scale(1.08)}
.slot span{font-size:18px;color:#222;line-height:1;padding:0 4px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .pc{font-size:17px;color:#7a2000}
.slot .off{position:absolute;top:4px;right:4px;background:#d63a2f;color:#fff;font:400 8px var(--px);padding:4px 5px}
.slot.pop{animation:popin .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*.06s)}
.det{background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:inset -4px -4px 0 #0b0d12,inset 4px 4px 0 #3a404c,0 0 0 4px #000;min-width:0}
.det .big{display:flex;justify-content:center;padding:14px;background:radial-gradient(circle,#3b4350,#14171d)}
.det .big img{width:128px;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.4))}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
.det h3{margin:0;font:400 15px/1.4 var(--px);color:var(--c,#fff);text-shadow:2px 2px 0 #000}
.det ul{margin:0;padding:0;list-style:none;color:#b79aff}
.det .pr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.det .old{text-decoration:line-through;color:var(--mute)}
.det .now{font:400 16px var(--px);color:var(--gold)}
.cd{display:flex;gap:10px;flex-wrap:wrap}
.cd div{background:#000;padding:8px 10px;min-width:62px;text-align:center;box-shadow:inset 0 0 0 2px #555}
.cd b{display:block;font:400 15px var(--px);color:var(--gold);font-variant-numeric:tabular-nums}
.cd small{font-size:17px;color:var(--mute)}

/* qadamlar */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:26px;counter-reset:s}
.step{background:var(--panel2);padding:20px;box-shadow:inset -4px -4px 0 #11141a,inset 4px 4px 0 #444b58,0 0 0 4px #000;min-width:0}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:44px;height:44px;margin-bottom:14px;background:var(--grass);color:#10300a;font:400 16px var(--px);box-shadow:inset -4px -4px 0 var(--grass-d),inset 4px 4px 0 #b6f593,0 0 0 3px #000}
.step h3{margin:0 0 8px;font:400 12px/1.5 var(--px);color:#fff}
.step p{margin:0;color:#c7ced6}

footer{background:rgba(20,14,8,calc(var(--secA,.9) + .05));padding:50px 0 120px;position:relative;z-index:1}
footer .row{display:flex;gap:26px;flex-wrap:wrap;justify-content:space-between}
footer .soc{display:grid;gap:10px}
footer .soc div{display:flex;gap:14px;flex-wrap:wrap}
footer .soc b{font:400 12px var(--px);color:var(--dia);overflow-wrap:anywhere}
footer small{display:block;margin-top:34px;color:var(--mute);font-size:18px;max-width:70ch}

/* savat */
#cartbtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:70}
#cartbtn .n{background:#d63a2f;padding:3px 7px;box-shadow:0 0 0 2px #000}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:90;background:var(--stone);color:#3f3f3f;padding:calc(20px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.9,.2,1);box-shadow:-6px 0 0 #000,inset 4px 4px 0 #fff;overflow:auto;display:flex;flex-direction:column;gap:16px}
#drawer.open{transform:none}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:85;opacity:0;pointer-events:none;transition:opacity .3s}
#veil.open{opacity:1;pointer-events:auto}
#drawer h4{margin:0;font:400 14px var(--px);display:flex;justify-content:space-between;align-items:center}
#drawer label{font:400 10px var(--px);display:block;margin-bottom:8px}
#nick{width:100%;padding:10px 12px;font:400 22px var(--vt);background:#000;color:#fff;border:0;box-shadow:inset 3px 3px 0 #555,0 0 0 3px #fff}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:#a9a9a9;padding:8px;box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #e8e8e8}
.line img{width:36px}
.line b{font-weight:400;font-size:20px;line-height:1.05;overflow-wrap:anywhere}
.line .q{display:flex;align-items:center;gap:6px;margin-top:4px}
.line .q button{width:28px;height:28px;border:0;background:#555;color:#fff;font:400 12px var(--px)}
.line .lp{font:400 11px var(--px);color:#5a1a00;text-align:right}
.empty{padding:18px;text-align:center;background:#a9a9a9;box-shadow:inset 3px 3px 0 #373737}
.tot{display:flex;justify-content:space-between;font:400 12px var(--px);padding-top:12px;border-top:4px solid #8b8b8b}
#order{width:100%;min-height:150px;font:400 20px/1.1 var(--vt);background:#000;color:#9cff7a;border:0;padding:10px;box-shadow:inset 3px 3px 0 #555;resize:vertical}
.note{font-size:20px;color:#4a2a00;background:#ffe9a8;padding:10px;box-shadow:inset 3px 3px 0 #c79a21}

/* tooltip va toast */
#tip{position:fixed;left:0;top:0;z-index:95;pointer-events:none;background:rgba(16,0,16,.94);padding:8px 12px;box-shadow:0 0 0 3px #000,0 0 0 5px #2d0a63;max-width:280px;display:none;font-size:22px;line-height:1.1}
#tip .t{color:#fff}#tip .l{color:#a89cff}#tip .p{color:var(--gold);margin-top:6px}
#toast{position:fixed;top:calc(76px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:97;display:grid;gap:10px;justify-items:start}
.tst{display:flex;gap:12px;align-items:center;background:#201a14;padding:10px 16px 10px 10px;box-shadow:0 0 0 3px #000,inset 0 0 0 3px #5a4a30;transform:translateX(-130%);transition:transform .5s cubic-bezier(.2,.9,.2,1);max-width:min(340px,calc(100vw - 24px))}
.tst.in{transform:none}
.tst .ic{width:44px;height:44px;background:#4a3a20;display:grid;place-items:center;flex:none}
.tst .ic img{width:30px}
.tst b{display:block;font:400 10px var(--px);color:var(--gold);margin-bottom:5px}
.tst span{color:#fff;font-size:21px;line-height:1}

/* XP chizig'i */
#xp{position:fixed;left:0;right:0;bottom:0;z-index:65;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#xp .lv{text-align:center;font:400 12px var(--px);color:#7cf05a;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;margin-bottom:4px}
#xp .bar{height:14px;background:#111;box-shadow:inset 0 0 0 2px #000,0 0 0 2px #555;position:relative;overflow:hidden;max-width:620px;margin:0 auto}
#xp .fill{height:100%;width:0;background:linear-gradient(#b6ff7a,#4ec21f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#xp.flash .fill{filter:brightness(1.7)}

.js .rv{opacity:0;transform:translateY(40px);transition:opacity .6s,transform .7s cubic-bezier(.3,1.5,.5,1);transition-delay:var(--rd,0s)}
.js .rv.in{opacity:1;transform:none}
@keyframes popin{from{transform:scale(.2);opacity:0}}

.btn.r{background:#c0392b;box-shadow:inset -4px -4px 0 #7a1d12,inset 4px 4px 0 #ff8a7a,0 0 0 3px #000}
.btn.r:hover{background:#e04a39;box-shadow:inset -4px -4px 0 #7a1d12,inset 4px 4px 0 #ffb0a4,0 0 0 3px #fff}
.pulse{animation:pls 1.2s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.07)}}
html.lock{overflow:hidden}
#game{display:none}
#game.open{display:block}
#gc{position:fixed;inset:0;width:100%;height:100%;z-index:58;pointer-events:none;image-rendering:pixelated}
#gx{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:96;min-height:40px;font-size:10px;padding:8px 14px}
.ctl{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:96;display:none;grid-template-columns:1fr 1fr;gap:12px}
.ctl .btn{min-height:60px;touch-action:none;user-select:none}
@media (pointer:coarse){#game.open .ctl{display:grid}}
#flash{position:fixed;inset:0;background:#fff;z-index:120;opacity:0;pointer-events:none}
#flash.go{animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#scorch{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(circle at 50% 45%,rgba(255,130,30,.35),rgba(10,6,4,.72) 70%)}
body.boomed #scorch{opacity:1}
body.boomed nav{background:transparent;border-bottom-color:transparent;backdrop-filter:none}
body.boomed .sec,body.boomed footer{background:transparent}
.sec,footer,nav{transition:background .5s,border-color .5s}
#boomhud{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:98;text-align:center;font:400 clamp(.9rem,3.4vw,1.8rem)/1.7 var(--px);color:#fff;text-shadow:3px 3px 0 #000;pointer-events:none;width:min(92vw,760px)}
.hint{cursor:pointer;font-size:26px;color:var(--gold)}
.hint2{margin-top:14px;color:#fff;text-shadow:2px 2px 0 #000;opacity:.9}
#potc{position:fixed;left:50%;bottom:0;width:min(78vw,560px);height:auto;aspect-ratio:160/150;image-rendering:pixelated;z-index:105;pointer-events:none;transform:translate(-50%,112%);transform-origin:50% 100%;display:none}
#bowc{position:fixed;inset:0;width:100%;height:100%;z-index:130;pointer-events:none}
#dot{display:none!important}
html.bow,html.bow *{cursor:none!important}
html.bow input,html.bow textarea{cursor:text!important}
#profbtn{display:grid;place-items:center;padding:0}
#prof{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(340px,calc(100vw - 24px));z-index:92;background:var(--stone);color:#3f3f3f;padding:16px;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,0 0 0 4px #000;display:grid;gap:14px;transform-origin:top right;animation:pf .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes pf{from{transform:scale(.6);opacity:0}}
